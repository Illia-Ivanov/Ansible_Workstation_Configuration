---


    - name: Enable Sicherheitupdates
      hosts: ubuntu_vms
      become: yes


      tasks:
        - name: Install apt unattended-upgrades
          package:
            name: unattended-upgrades
            state: present
            

        - name: Ensure unattended-upgrades service is started and enabled
          service:
            name: unattended-upgrades
            state: started
            enabled: yes
